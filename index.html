<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind custom config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#2563EB",
                dark:    "#1D4ED8",
                light:   "#EFF6FF",
                glow:    "rgba(37,99,235,0.18)",
              },
              accent: {
                DEFAULT: "#F97316",
                dark:    "#EA580C",
                light:   "#FFF7ED",
              },
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
            boxShadow: {
              card:    "0 2px 8px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.04)",
              "card-hover": "0 8px 24px rgba(37,99,235,0.13), 0 0 0 1px rgba(37,99,235,0.10)",
              "glow-blue": "0 0 0 3px rgba(37,99,235,0.22)",
            },
          },
        },
      };
    </script>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="min-h-screen font-sans antialiased">

    <!-- ── BACKGROUND DECORATIVE ── -->
    <div class="page-bg" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>

    <!-- ===================== HEADER ===================== -->
    <header class="header-glass sticky top-0 z-40">
      <div class="max-w-2xl mx-auto px-5 py-4 flex items-center justify-between">

        <!-- Logo + title -->
        <div class="flex items-center gap-3">
          <div class="header-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2
                   M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2
                   M9 12l2 2 4-4" />
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-bold text-slate-800 leading-tight tracking-tight">Task List</h1>
            <p class="text-xs text-slate-400 leading-none">Kelola aktivitasmu</p>
          </div>
        </div>

        <!-- Progress bar area -->
        <div class="flex items-center gap-3">
          <div class="hidden sm:flex flex-col items-end gap-1">
            <span id="progress-label" class="text-xs font-medium text-slate-500"></span>
            <div class="progress-track">
              <div id="progress-bar" class="progress-fill"></div>
            </div>
          </div>
        </div>

      </div>
    </header>

    <!-- ===================== MAIN ===================== -->
    <main class="max-w-2xl mx-auto px-4 py-8 space-y-5 relative z-10">

      <!-- ── FORM TAMBAH TASK ── -->
      <section aria-label="Tambah task baru">
        <div class="card-surface p-5">
          <h2 class="section-label mb-3">Tambah Task Baru</h2>
          <form id="task-form" class="flex flex-col sm:flex-row gap-3" novalidate>
            <div class="flex-1 relative">
              <span class="input-icon">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                  viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
              </span>
              <input
                id="task-input"
                type="text"
                placeholder="Apa yang ingin kamu kerjakan?"
                maxlength="120"
                autocomplete="off"
                class="task-main-input"
              />
            </div>
            <button type="submit" class="btn-primary">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
              </svg>
              Tambah
            </button>
          </form>
          <p id="input-error" class="hidden text-xs text-red-500 mt-2 pl-1 flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
            Task tidak boleh kosong.
          </p>
        </div>
      </section>

      <!-- ── FILTER BAR ── -->
      <section aria-label="Filter dan ringkasan task">
        <div class="card-surface px-4 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div id="filter-buttons" class="flex gap-1.5" role="group" aria-label="Filter task">
            <button data-filter="all"       class="filter-btn active-filter">
              <span class="filter-dot dot-all"></span>Semua
            </button>
            <button data-filter="active"    class="filter-btn">
              <span class="filter-dot dot-active"></span>Aktif
            </button>
            <button data-filter="completed" class="filter-btn">
              <span class="filter-dot dot-done"></span>Selesai
            </button>
          </div>
          <p id="task-summary" class="text-xs text-slate-400 font-medium tabular-nums"></p>
        </div>
      </section>

      <!-- ── DAFTAR TASK ── -->
      <section aria-label="Daftar task" aria-live="polite">
        <!-- Hint drag & drop -->
        <p id="dnd-hint" class="hidden text-center text-xs text-slate-400 mb-2 select-none">
          ☰ Seret kartu untuk mengubah urutan
        </p>

        <ul id="task-list" class="space-y-2.5">
          <!-- dirender JS -->
        </ul>

        <!-- Drop zone placeholder (tampil saat drag aktif) -->
        <div id="drop-placeholder" class="drop-placeholder hidden"></div>

        <!-- Empty state -->
        <div id="empty-state" class="hidden text-center py-16">
          <div class="empty-icon-wrap mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-primary/50" fill="none"
              viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7
                   a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2
                   M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
          </div>
          <p id="empty-message" class="text-slate-400 text-sm font-medium">Belum ada task. Yuk tambahkan!</p>
          <p class="text-slate-300 text-xs mt-1">Ketik di kolom di atas lalu tekan Enter</p>
        </div>
      </section>

      <!-- ── FOOTER ACTION ── -->
      <div class="flex items-center justify-between px-1">
        <p class="text-xs text-slate-300 select-none">Urutan tersimpan otomatis</p>
        <button id="clear-completed-btn"
          class="hidden text-xs text-slate-400 hover:text-red-500 font-medium
                 flex items-center gap-1 transition-colors duration-150">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7
                 m5 4v6m4-6v6M9 7V4h6v3M3 7h18"/>
          </svg>
          Hapus semua selesai
        </button>
      </div>

    </main>

    <script src="script.js"></script>
  </body>
</html>
